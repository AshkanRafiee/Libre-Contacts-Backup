plugins { id 'com.android.application' }

android { namespace = 'com.ashkanrafiee.librecontactsbackup'; compileSdk 35
    defaultConfig { applicationId 'com.ashkanrafiee.librecontactsbackup'; minSdk 26; targetSdk 35; versionCode 18; versionName '2.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    dependenciesInfo { includeInApk = false; includeInBundle = false }
    def signingFile = rootProject.file('signing.properties')
    def signingValues = new Properties()
    if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
    signingConfigs { release {
        if (signingValues['storeFile']) {
            storeFile rootProject.file(signingValues['storeFile'])
            if (signingValues['storeType']) storeType signingValues['storeType']
            storePassword signingValues['storePassword']
            keyAlias signingValues['keyAlias']
            keyPassword signingValues['keyPassword']
            enableV1Signing false
            enableV3Signing true
        }
    } }
    buildTypes { release {
        if (signingValues['storeFile']) signingConfig signingConfigs.release
        minifyEnabled false
        // AGP embeds the local .git commit SHA into META-INF/version-control-info.textproto
        // by default. F-Droid's build server checks out a clean source tree with no .git
        // directory, so it can never reproduce that file, which fails F-Droid's byte-for-byte
        // reproducible-build check against our published release binary even when the actual
        // compiled code is identical (verified: classes.dex matches either way). Disabling
        // this embedding is the documented fix for this exact class of non-reproducibility.
        vcsInfo { include = false }
    } }
    testOptions { managedDevices { localDevices { "pixel_6" { apiLevel = 34 } } } }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
}
