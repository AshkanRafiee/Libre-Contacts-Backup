plugins { id 'com.android.application' }

android { namespace = 'com.ashkanrafiee.librecontactsbackup'; compileSdk 35
    defaultConfig { applicationId 'com.ashkanrafiee.librecontactsbackup'; minSdk 26; targetSdk 35; versionCode 19; versionName '2.3.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    dependenciesInfo { includeInApk = false; includeInBundle = false }
    def signingFile = rootProject.file('signing.properties')
    def signingValues = new Properties()
    if (signingFile.exists()) signingFile.withInputStream { signingValues.load(it) }
    signingConfigs { release {
        if (signingValues['storeFile']) {
            storeFile rootProject.file(signingValues['storeFile'])
            if (signingValues['storeType']) storeType signingValues['storeType']
            storePassword signingValues['storePassword']
            keyAlias signingValues['keyAlias']
            keyPassword signingValues['keyPassword']
            enableV1Signing false
            enableV3Signing true
        }
    } }
    buildTypes { release {
        if (signingValues['storeFile']) signingConfig signingConfigs.release
        minifyEnabled false
        // AGP embeds the local .git commit SHA into META-INF/version-control-info.textproto
        // by default. This isn't needed by anything we do and is one less
        // build-environment-dependent file inside the APK, so it's turned off
        // as a general reproducibility precaution (F-Droid's actual v2.2.0
        // build failure turned out to be caused by something else — see the
        // JavaCompile toolchain pin below — but this is still worth keeping).
        vcsInfo { include = false }
    } }
    testOptions { managedDevices { localDevices { "pixel_6" { apiLevel = 34 } } } }
}

// Different javac versions can emit subtly different bytecode for the same
// source even when targeting the same old --release level (confirmed here:
// JDK 21 produces a different classes.dex than JDK 17 from identical
// source). Our GitHub release binaries are built with JDK 17 (see
// .github/workflows/release.yml), but F-Droid's own build server uses
// JDK 21, which broke its byte-for-byte reproducible-build check against
// that binary even though the source and Gradle/AGP versions matched
// exactly. Pinning a toolchain forces every compiler invocation onto JDK 17
// regardless of whichever JDK actually launches Gradle, so the two always
// agree. The foojay-resolver-convention plugin (settings.gradle) lets
// Gradle auto-provision JDK 17 if it isn't already installed.
tasks.withType(JavaCompile).configureEach {
    javaCompiler.set(javaToolchains.compilerFor {
        languageVersion.set(JavaLanguageVersion.of(17))
    })
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
}
